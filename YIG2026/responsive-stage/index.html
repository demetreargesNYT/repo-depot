<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Year in Games 2026: responsive stage prototype</title>
  <link rel="stylesheet" href="styles.css?v=20261021c">
</head>
<body>
  <!-- One stage in Figma artboard coordinates. The 375px phone frame sits at --column-x, so the header and
       text keep their positions relative to the Rive artboard at every window size. -->
  <main class="stage">
    <!-- All graphics and animation: the one Rive artboard (1495x1067). Everything else here is HTML text. -->
    <canvas class="rive-canvas" id="rive-canvas" aria-hidden="true"></canvas>
    <!-- Rive template guides (prototype aid), toggled with the Rive template button / T. -->
    <img class="template-guides" src="assets/yig-rive-template-guides.svg" alt="" aria-hidden="true">
    <header class="nav">
      <button class="nav-icon" type="button" aria-label="Menu"></button>
      <div class="progress" role="presentation"></div>
      <img class="wordmark" src="assets/year-in-games.svg" alt="Year in Games">
      <button class="nav-close" type="button" aria-label="Close"></button>
    </header>

    <!-- Screens are mounted from screens.js (renderer-style lines + PROTOTYPE_PAYLOAD). -->
    <section class="screen" id="screen-root" aria-label="Year in Games screen"></section>

  </main>

  <!-- Device overlay: same position and scale as the stage, but not clipped by the card. -->
  <div class="overlay-root" aria-hidden="true">
    <div class="device-frame"><span class="device-label"></span></div>
  </div>

  <div class="controls">
    <div class="controls-group">
      <button id="prev" type="button" aria-label="Previous screen">&larr;</button>
      <span id="step-label" aria-live="polite">1 / 45</span>
      <button id="next" type="button" aria-label="Next screen">&rarr;</button>
    </div>
    <div class="controls-group">
      <button id="template-toggle" type="button" aria-pressed="false">Rive template: Off (T)</button>
      <button id="overlay-toggle" type="button" aria-pressed="false">Overlay: Off (O)</button>
      <select id="device-select" aria-label="Overlay device"></select>
    </div>
    <div class="controls-group controls-slider">
      <label for="min-scale">Min scale <output id="min-scale-value">90%</output></label>
      <input id="min-scale" type="range" min="50" max="100" step="5" value="90">
      <span id="min-scale-note">Crops below 609px tall</span>
    </div>
  </div>
  <script src="assets/vendor/rive.js"></script>
  <script src="screens.js?v=20261021c"></script>
  <script src="stage-render.js?v=20261021c"></script>
  <script src="controls.js?v=20261021c"></script>
</body>
</html>
