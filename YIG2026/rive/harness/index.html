<style>
/* Page chrome. Your site already loads NYT Franklin and NYT Karnak; these fall back to system fonts without them. */
:root {
  --paper: #F1F3EE; --surface: #FFFFFF; --ink: #1F1F1F; --muted: #5C6759; --line: #D3DACF;
  --ui: "NYT Franklin", "Helvetica Neue", Arial, sans-serif;
  --display: "NYT Karnak", Georgia, serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* .blk sets display:grid, which would otherwise beat the hidden attribute */
body { margin: 0; background: var(--paper); color: var(--ink); font: 500 14px/1.4 var(--ui); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px 24px 48px; display: grid; justify-items: center; gap: 12px; }
.bar { width: min(100%, 1100px); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
h1 { font: 700 18px/1.2 var(--display); margin: 0; margin-right: auto; }
.bar button { font: 500 13px var(--ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.bar button:hover { border-color: var(--ink); }
.bar button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
.seg button:last-child { border-radius: 0 8px 8px 0; }

/* The stage: the full 1495 x 1067 artboard on desktop; on a phone, the centre 375 wide. */
.stage { position: relative; container-type: inline-size; overflow: hidden; background: #E7F1E1; border: 1px solid var(--line); }
.stage.full { width: min(100%, 1100px); aspect-ratio: 1495 / 1067; border-radius: 12px; }
.stage.phone { width: 300px; aspect-ratio: 375 / 812; border-radius: 38px; }
.art { position: absolute; }
.stage.full .art { left: 0; top: 0; width: 100cqw; height: calc(100cqw * 1067 / 1495); }
.stage.phone .art { left: calc(-100cqw * 560 / 375); top: 0; width: calc(100cqw * 1495 / 375); height: calc(100cqw * 1067 / 375); }
.art canvas { width: 100%; height: 100%; display: block; }
.phonebox { position: absolute; container-type: inline-size; pointer-events: none; }
.stage.full .phonebox { left: calc(100cqw * 560 / 1495); top: 0; width: calc(100cqw * 375 / 1495); height: calc(100cqw * 812 / 1495); outline: 1px dashed rgba(31, 31, 31, .5); }
.stage.phone .phonebox { inset: 0; }
.phonebox .overlay { overflow: hidden; }
/* tap the right half for Next, the left half for Back */
.tap { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 1; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tap:focus { outline: none; }
.tap:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }
#tap-back { left: 0; }
#tap-next { right: 0; }

/* The text layer. Sizes are in units of the 375-wide phone frame (--u), so the copy scales with the stage. */
.overlay { --u: calc(100cqw / 375); position: absolute; inset: 0; color: #1F1F1F; pointer-events: none; }
.hdr { position: absolute; top: calc(50 * var(--u)); left: 0; right: 0; display: grid; justify-items: center; gap: calc(22 * var(--u)); }
.hdr > svg { width: calc(171 * var(--u)); height: auto; }
.dashes { width: calc(339 * var(--u)); height: calc(2 * var(--u)); background:
  linear-gradient(90deg, #1F1F1F 0 calc(9 * var(--u)), transparent 0) 0 0 / 100% 100% no-repeat,
  repeating-linear-gradient(90deg, #8C9C88 0 calc(9 * var(--u)), transparent calc(9 * var(--u)) calc(12 * var(--u))); }
.blk { position: absolute; left: calc(16 * var(--u)); right: calc(16 * var(--u)); text-align: center; display: grid; justify-items: center; }
.blk-copy1 { top: calc(168 * var(--u)); }
.blk-icon { top: calc(165 * var(--u)); }
/* the icon is its own block, so the card starts below it: icon height (49) + its 22 gap */
.blk-stat { top: calc(236 * var(--u)); }
.t-serif { font: 500 calc(22 * var(--u)) / 1.36 var(--display); letter-spacing: -.005em; }
.t-big { font: 700 calc(25 * var(--u)) / 1.3 var(--display); }
.t-small { font: 500 calc(15.5 * var(--u)) / 1.42 var(--ui); }
.t-icon { margin-bottom: calc(22 * var(--u)); }
.t-icon svg { width: calc(50 * var(--u)); height: auto; display: block; }
.pill { width: calc(154 * var(--u)); height: calc(39 * var(--u)); display: grid; place-items: center; border: calc(1.5 * var(--u)) solid #1F1F1F; border-radius: calc(8 * var(--u)); font: 700 calc(19 * var(--u)) / 1 var(--ui); letter-spacing: .02em; padding-top: calc(2 * var(--u)); margin-top: calc(11 * var(--u)); }
.pill-blue { background: #B0C4EF; }
.pill-green { background: #A0C35A; }
.pill-yellow { background: #F9DF6D; }
.pill-purple { background: #BA81C5; }
/* spacing by what precedes a line, so cards of any length lay out the same way */
.blk-stat > .yig-mask:has(.t-big) { margin-top: calc(14 * var(--u)); }
.blk-stat > .yig-mask:has(.t-serif) + .yig-mask:has(.t-serif) { margin-top: 0; }
.blk-stat > .yig-mask:has(.t-big) + .yig-mask:has(.t-serif) { margin-top: calc(14 * var(--u)); }
.blk-stat > .yig-mask:has(.t-small) { margin-top: calc(10 * var(--u)); }
.blk-stat > .yig-mask:has(.t-small) + .yig-mask:has(.t-small) { margin-top: 0; }
.blk-stat > .yig-mask + .pill { margin-top: calc(24 * var(--u)); }
/* starting words: one line per word, 4 apart like the Figma tile stack */
.blk-stat > .yig-word { margin-top: calc(4 * var(--u)); }
.blk-stat > .yig-mask:not(.yig-word) + .yig-word { margin-top: calc(16 * var(--u)); }
.blk-stat > .yig-word + .yig-mask:has(.t-small) { margin-top: calc(14 * var(--u)); }
/* Wordle letter tiles */
.tilerows { display: grid; gap: calc(4 * var(--u)); }
.blk-stat > .yig-mask:has(.tilerows) { margin-top: calc(16 * var(--u)); }
.blk-stat > .yig-mask:has(.tilerows) + .yig-mask:has(.t-small) { margin-top: calc(14 * var(--u)); }
.tiles { display: flex; gap: calc(4 * var(--u)); justify-content: center; }
.tile { width: calc(47 * var(--u)); height: calc(47 * var(--u)); display: grid; place-items: center; box-sizing: border-box;
  border: calc(1.5 * var(--u)) solid #1F1F1F; background: #FFFFFF; font: 700 calc(26 * var(--u)) / 1 var(--ui); }
.tile-green { background: #6AAA64; border-color: #6AAA64; color: #FFFFFF; }
/* community card: the popular word, larger, in the Figma frame's green tiles with dark borders */
.tiles-big { gap: calc(4 * var(--u)); }
.tiles-big .tile { width: calc(47 * var(--u) * 1.06); height: calc(47 * var(--u) * 1.06); font-size: calc(31 * var(--u)); border-color: #1F1F1F; }
</style>

<script type="module">
// The integration. Its Rive instance starts loading as soon as it's imported; nothing moves until start() and a tap.
import { start, onTap, onBack, setScene, yig } from "./chapter-2-integration.js";

// ---------------------------------------------------------------------------------------------------------------
// EXAMPLE DATA. This stands in for the Games API. None of these numbers are real.
// To try other cases, edit EXAMPLE_PLAYER and press Restart:
//   - flip gameOrder to ["connections", "wordle"]
//   - give connections solves: 10 or more, to get its own cards instead of the community card
//   - set wordle.topStartingWords to one word (singular label) or [] (the card is left out)
//   - set wordle.hardestWordResult to "solved", "missed" or "not played"
// ---------------------------------------------------------------------------------------------------------------
// The text test (harness/text-test.mjs) swaps in other players here, through window.__yigTestPlayer.
const EXAMPLE_PLAYER = window.__yigTestPlayer ?? {
  gameOrder: ["wordle", "connections", "strands", "spelling-bee", "mini", "midi", "daily"],
  wordle: {
    solves: 212,
    averageGuesses: 3.9,
    bestGuesses: 2,
    bestGuessesCount: 14,
    topStartingWords: ["ADIEU", "CRANE"],
    hardestWordResult: "missed", // "solved" | "missed" | "not played"
  },
  // PLACEHOLDER stats for the four newest rooms: only here so you can tap through all seven games.
  strands: { solves: 30 },
  mini: { solves: 50 },
  midi: { solves: 40 },
  daily: { solves: 90 },
  "spelling-bee": {
    solves: 64,
    genius: 21,
    pangrams: 38,
  },
  connections: {
    solves: 7, // fewer than 10: this player gets the community card for Connections
    solvingOrder: ["yellow", "green", "blue", "purple"],
    purpleFirstCount: 3,
    solveRate: 86,
    averageMistakes: 1.4,
    perfectPuzzles: 2,
  },
};

// EXAMPLE DATA too: the year-wide numbers, the same for every player.
const EXAMPLE_COMMUNITY = {
  wordle: {
    averageGuesses: 4.1,            // across all solvers
    mostPopularStartingWord: "ADIEU",
    hardestWord: "PSHAW",
    hardestWordMonth: "July",
    hardestWordDay: 15,
    hardestWordStumpedPercent: 38,
  },
  connections: {
    pictureOnlyDate: "February 7",
    pictureOnlyStumpedPercent: 61,
  },
};

// An example of the logic you'll write: the chapter's cards in order, from the player's stats. The opener comes
// first, then each game in the player's order. With 10 or more solves a game gets the player's own cards, in design
// order, leaving out a card that has no stat to show; with fewer it gets one community card.
// Each card's game and community are what chapter-2-integration.js reads; card and variant are only for this page's copy.
function buildCards(p) {
  // The file opens on the empty Chapter 1 room (where File 1 ends and Ad 2 plays): always the first card, with no copy.
  // The first tap pans from it into the opener.
  const cards = [{ game: "chapter1" }, { game: "opener" }];
  for (const game of p.gameOrder) {
    const s = p[game];
    if (!s) continue;
    if (s.solves < 10) { cards.push({ game, community: true }); continue; }
    if (game === "wordle") {
      cards.push({ game, card: "average-guesses" });
      cards.push({ game, card: "best-solves" });
      cards.push({ game, card: "hardest-word", variant: s.hardestWordResult });
      if (s.topStartingWords.length) cards.push({ game, card: "starting-words" });
    }
    if (["strands", "mini", "midi", "daily"].includes(game)) cards.push({ game, card: "placeholder" });
    if (game === "spelling-bee") {
      cards.push({ game, card: "pangrams" });
      cards.push({ game, card: "genius" });
    }
    if (game === "connections") {
      cards.push({ game, card: "solving-order" });
      if (s.purpleFirstCount > 0) cards.push({ game, card: "purple-first" });
      cards.push({ game, card: "solve-rate" });
      cards.push({ game, card: "average-mistakes" });
      if (s.perfectPuzzles > 0) cards.push({ game, card: "perfect-puzzles" });
    }
  }
  // The Chapter 2 ending: after the player's last game, this card's own tap leaves that room for the empty Chapter 3
  // backdrop. Copy and timing are placeholder; the card itself (and chapter-2-integration.js's SCENE/BUILT entries
  // for "chapter3") are the framework piece.
  cards.push({ game: "chapter3", card: "end" });
  return cards;
}

// The copy. Everything that goes into markup passes through esc(), because the real values come from an API.
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
// one designed line, in its own mask so it can rise on its own
const line = (style, text) => `<span class="yig-mask"><span class="yig-line ${style}">${esc(text)}</span></span>`;
const tiles = (word) => [...word].map((ch) => `<span class="tile tile-green">${esc(ch)}</span>`).join("");
const pill = (colour) => `<span class="yig-pop pill pill-${esc(colour)}">${esc(colour.toUpperCase())}</span>`;

// Placeholder copy: the last line of the hardest-word card, by whether the player solved that day's puzzle.
const HARDEST_WORD_ENDING = { missed: "including you!", solved: "but not you!", "not played": "You sat that one out." };

const placeholder = (title) => [line("t-serif", title), line("t-big", "Placeholder"), line("t-small", "PLACEHOLDER COPY")];

const opener = [
  line("t-serif", "Let’s take a closer look"),
  line("t-serif", "at your puzzle powers."),
];

// Every card's copy is rendered up front, hidden. The integration file finds a card's copy by data-copy-frame (its
// index in the cards) and a game's icon by data-icon-game. data-copy-game and data-copy-card are for the text test.
// buildCards gives the same list for the same player, so the indexes here match the cards passed to start().
function renderCopy(player, community) {
  const cards = buildCards(player);
  let html = "";
  // chapter3 (the ending) has no lockup and no small icon of its own, so it's left out here, not just "opener".
  const games = [...new Set(cards.map((c) => c.game).filter((g) => g !== "opener" && ICON[g]))];
  for (const game of games) {
    html += `<div class="yig-icon blk blk-icon" data-icon-game="${esc(game)}" hidden><span class="yig-pop t-icon">${ICON[game]}</span></div>`;
  }
  const position = {}; // 1-based position of each own card within its game
  cards.forEach((card, i) => {
    if (card.game === "chapter1") return; // nothing to read here: the room is empty
    if (card.game === "opener") {
      html += `<div class="yig-text blk blk-copy1" data-copy-frame="${i}" data-copy-game="opener" hidden>${opener.join("")}</div>`;
      return;
    }
    const render = COPY[card.game][card.community ? "community" : card.card];
    const lines = render(player[card.game], community[card.game], card).join("");
    const n = card.community ? "" : ` data-copy-card="${(position[card.game] = (position[card.game] ?? 0) + 1)}"`;
    html += `<div class="yig-text blk blk-stat" data-copy-frame="${i}" data-copy-game="${esc(card.game)}"${n} hidden>${lines}</div>`;
  });
  document.getElementById("overlay").insertAdjacentHTML("beforeend", html);
}

// The whole integration: render the copy, hand the cards to start(), then send it taps.
renderCopy(EXAMPLE_PLAYER, EXAMPLE_COMMUNITY);
const cards = buildCards(EXAMPLE_PLAYER); start(cards);

document.getElementById("tap-next").addEventListener("click", () => onTap());
document.getElementById("tap-back").addEventListener("click", () => onBack());
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") { e.preventDefault(); onTap(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); onBack(); }
});

// Review controls, not part of the integration.
document.getElementById("restart").addEventListener("click", () => location.reload());
function setSize(size) {
  document.getElementById("stage").className = `stage ${size}`;
  document.getElementById("v-full").setAttribute("aria-pressed", String(size === "full"));
  document.getElementById("v-phone").setAttribute("aria-pressed", String(size === "phone"));
  yig.resizeDrawingSurfaceToCanvas(); // the canvas changed size, so the drawing surface follows
}
document.getElementById("v-full").addEventListener("click", () => setSize("full"));
document.getElementById("v-phone").addEventListener("click", () => setSize("phone"));
window.addEventListener("resize", () => yig.resizeDrawingSurfaceToCanvas());

// for the console and the text test
window.yigExample = { cards, start, onTap, onBack, setScene, yig };
