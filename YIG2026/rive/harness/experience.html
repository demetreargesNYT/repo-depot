<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year in Games 2026 · the full experience (review)</title>
<link rel="icon" href="data:,">
<!--
  Our review page for the whole experience. It shows experience-stage.html in a frame the size of the chosen screen,
  so the frame's own viewport is that screen: engineering's framing (yig-framing.css), its portrait crop and its
  desktop breakpoint all respond as they would on the device. "Window" makes the frame fill the window, so resizing
  the browser resizes the experience. Not an engineering file.
-->
<style>
:root { --paper: #F1F3EE; --surface: #FFFFFF; --ink: #1F1F1F; --muted: #5C6759; --line: #D3DACF; --ui: "NYT Franklin", "Helvetica Neue", Arial, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 500 13px/1.3 var(--ui); display: flex; flex-direction: column; overflow: hidden; }
.bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.bar h1 { font: 700 15px/1.2 "NYT Karnak", Georgia, serif; margin: 0 6px 0 0; }
.bar label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.bar select, .bar button { font: 500 13px var(--ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; cursor: pointer; }
.bar select:hover, .bar button:hover { border-color: var(--ink); }
.status { flex: none; padding: 5px 12px; font: 500 12px var(--ui); color: var(--muted); border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.main { flex: 1; min-height: 0; display: flex; }
.area { flex: 1; min-width: 0; position: relative; overflow: hidden; display: grid; place-items: start center; }
.area.device { padding: 12px; }
.frame { border: 0; display: block; background: #FFF; transform-origin: top center; }
.area.device .frame { box-shadow: 0 0 0 1px var(--line), 0 6px 24px rgba(0, 0, 0, .12); border-radius: 18px; }
.area.window .frame { width: 100%; height: 100%; }
.bar button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
/* the Finesse panel: docked at the right, off by default (button or the F key). Nothing here changes the stage. */
#finesse { flex: none; width: 292px; border-left: 1px solid var(--line); background: var(--surface); overflow: auto; font-size: 12px; }
#finesse[hidden] { display: none; }
.fin-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.fin-head b { font: 700 13px var(--ui); }
.fin-head small { color: var(--muted); flex: 1; }
#finesse.folded .fin-body { display: none; }
.fin-body { padding: 10px 12px 14px; display: grid; gap: 10px; }
#finesse button { font: 500 12px var(--ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; cursor: pointer; }
#finesse button:hover:not(:disabled) { border-color: var(--ink); }
#finesse button:disabled { opacity: .4; cursor: default; }
#finesse button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.fin-room { color: var(--muted); line-height: 1.35; }
.fin-room b { color: var(--ink); }
.fin-tc { display: flex; align-items: baseline; gap: 6px; }
.fin-tc #fin-time { font: 700 34px/1 var(--ui); font-variant-numeric: tabular-nums; }
.fin-tc small { color: var(--muted); }
.fin-tc #fin-frame { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.fin-track { position: relative; height: 26px; background: #EEF1EA; border-radius: 6px; overflow: hidden; }
.fin-track .intro { position: absolute; top: 0; bottom: 0; left: 0; background: #DDE6D4; }
.fin-track .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: #C2570A; }
.fin-track .tick.small { top: 60%; width: 1px; background: #2F6FB0; }
.fin-track .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
.fin-scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: -6px; }
.fin-ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.fin-ctl .sp { margin-left: auto; display: flex; gap: 4px; }
.fin-list { color: var(--muted); line-height: 1.4; }
.fin-list b { color: var(--ink); font-variant-numeric: tabular-nums; }
.fin-hist { color: #8A4B00; min-height: 1.2em; }
.fin-note { margin: 0; color: var(--muted); line-height: 1.4; }
.fin-seam { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #D3DACF; vertical-align: middle; margin-right: 5px; }
.fin-seam.on { background: #C2570A; }
#seam-flash { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: #C2570A; opacity: 0; pointer-events: none; z-index: 5; }
#seam-flash.small { background: #2F6FB0; }
#seam-flash.on { opacity: 1; transition: none; }
#seam-flash:not(.on) { transition: opacity .35s ease-out; }
</style>
</head>
<body>
<div class="bar">
  <h1>Year in Games 2026 · full experience</h1>
  <label>Flow <select id="flow"><option value="sub">Subscriber / registered</option><option value="anon">Anon</option></select></label>
  <label id="player-wrap">Player <select id="player">
    <option value="wordle-only">Wordle only (Chapter 2.5; both badge cards)</option>
    <option value="midi-only">Midi only (all five community cards; event badges only)</option>
    <option value="several-games">Several games (no 2.5; achievement badges only)</option>
    <option value="all-seven">All seven games (no badge cards)</option>
    <option value="connections-only">Connections only (Chapter 2.5; achievement badges only)</option>
    <option value="none">No qualifying game (gets the anonymous flow)</option>
  </select></label>
  <label id="top-wrap">Top game <select id="top">
    <option value="">The player's first game</option>
    <option value="wordle">Wordle</option><option value="connections">Connections</option><option value="strands">Strands</option>
    <option value="spelling-bee">Spelling Bee</option><option value="mini">The Mini</option><option value="midi">The Midi</option>
    <option value="daily">The Crossword</option>
  </select></label>
  <label>Screen <select id="size">
    <option value="window">Window (resize the browser)</option>
    <option value="375x667">iPhone SE · 375 × 667</option>
    <option value="375x812">Phone · 375 × 812 (the Figma frame)</option>
    <option value="430x932">iPhone 15 Pro Max · 430 × 932</option>
    <option value="820x1180">iPad portrait · 820 × 1180</option>
    <option value="1440x900">Desktop · 1440 × 900</option>
  </select></label>
  <label>Jump to <select id="jump"></select></label>
  <button id="restart">Restart</button>
  <button id="finesse-toggle" aria-pressed="false" title="Finesse panel (F)">Finesse</button>
</div>
<div class="status" id="status">Loading…</div>
<div class="main">
<div class="area window" id="area"><iframe class="frame" id="frame" title="The experience"></iframe><div id="seam-flash"></div></div>
<aside id="finesse" hidden aria-label="Finesse">
  <div class="fin-head"><b>Finesse</b><small>F shows or hides it</small><button id="fin-fold" title="Fold the panel">–</button></div>
  <div class="fin-body">
    <div class="fin-room" id="fin-room">Waiting for the stage…</div>
    <div><button id="fin-replay" title="Reload the experience on this room's first card and play its intro again, then its loop">Replay room</button> <button id="fin-rive" aria-pressed="false" title="Hide all the HTML and show only the animation (H)">Rive only</button></div>
    <div class="fin-tc"><span id="fin-time">0.0</span><small>s</small><span id="fin-frame"></span></div>
    <div class="fin-track" id="fin-track"></div>
    <div class="fin-scale"><span>0</span><span id="fin-span"></span></div>
    <div class="fin-ctl">
      <button id="fin-back" title="One frame back (,) through the last 2 s">◀|</button>
      <button id="fin-play" title="Pause or play (Space)">⏸</button>
      <button id="fin-fwd" title="One frame forward (.)">|▶</button>
      <span class="sp"><button data-speed="1" aria-pressed="true">1×</button><button data-speed="0.5" aria-pressed="false">0.5×</button></span>
    </div>
    <div class="fin-hist" id="fin-hist"></div>
    <div class="fin-list" id="fin-list"></div>
    <p class="fin-note">The clock runs the Rive animation only. The copy's own timers keep real time, so tap on the stage only when the pan has ended at 0.5×. Stepping back shows the last 2 s at reduced size.</p>
  </div>
</aside>
</div>

<script>
const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const fields = ["flow", "player", "top", "size"];
for (const f of fields) if (q.get(f) !== null) $(f).value = q.get(f);
let riveOnly = q.has("rive-only");            // the "Rive only" viewing option; the stage page owns the display (see experience-stage.html)
const fin = { on: q.get("finesse") === "1", speed: 1, timing: {}, key: "", zero: 0, first: true, visited: new Set(), lastTc: 0, passed: 0, paused: false };

function stageUrl(jump, goto) {
  const p = new URLSearchParams({ flow: $("flow").value, player: $("player").value });
  if ($("top").value) p.set("top", $("top").value);
  if (goto) p.set("goto", goto);
  else if (jump) p.set("jump", jump);
  if (fin.on) p.set("finesse", "1");          // the server then adds the Finesse clock to the stage page
  if (riveOnly) p.set("rive-only", "");
  return `/experience-stage?${p}`;
}
function remember() {
  const p = new URLSearchParams();
  for (const f of fields) p.set(f, $(f).value);
  if (fin.on) p.set("finesse", "1");
  history.replaceState(null, "", `?${p}${riveOnly ? "&rive-only" : ""}`);
}
function layout() {
  const area = $("area"), frame = $("frame");
  const size = $("size").value;
  const subs = $("flow").value === "sub";
  $("player-wrap").hidden = !subs;
  $("top-wrap").hidden = !subs;
  if (size === "window") {
    area.className = "area window";
    frame.style.width = frame.style.height = frame.style.transform = "";
    return;
  }
  const [w, h] = size.split("x").map(Number);
  area.className = "area device";
  frame.style.width = `${w}px`;
  frame.style.height = `${h}px`;
  const scale = Math.min(1, (area.clientWidth - 24) / w, (area.clientHeight - 24) / h);
  frame.style.transform = `scale(${scale})`;
}
let started = false;
function load(jump = 0, goto = "") {
  started = true;
  fin.key = ""; fin.visited.clear(); fin.paused = false;     // a fresh stage: its clock starts again, unpaused
  fin.loading = true;                                        // the old stage is still alive until the new one loads: the panel ignores it, so it cannot mark rooms visited again
  if (fin.on) loadTiming();
  remember();
  layout();
  $("frame").src = stageUrl(jump, goto);
}
$("frame").addEventListener("load", () => { fin.key = ""; fin.visited.clear(); fin.loading = false; });   // the new stage is in: the panel starts clean
for (const f of fields) $(f).addEventListener("change", () => (f === "size" ? (remember(), layout()) : load()));
$("restart").addEventListener("click", () => load());
$("jump").addEventListener("change", () => {
  const entry = SCENES[Number($("jump").value)];
  $("jump").selectedIndex = 0;
  if (!entry) return;
  // a scene the current flow or player doesn't have switches them to ones that do
  if (entry.flow) $("flow").value = entry.flow;
  if (entry.top) $("top").value = entry.top;
  if (entry.game && $("flow").value === "sub" && !QUALIFYING[$("player").value].includes(entry.game)) $("player").value = entry.player || "all-seven";
  if (entry.player && !entry.game) $("player").value = entry.player;
  load(0, entry.goto);
});
addEventListener("resize", layout);
// keys pressed outside the frame still move the experience
addEventListener("keydown", (e) => {
  const x = $("frame").contentWindow?.yigExperience;
  if (!x) return;
  if (e.key === "ArrowRight") { e.preventDefault(); x.onTap(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); x.onBack(); }
  if ((e.key === "h" || e.key === "H") && !e.metaKey && !e.ctrlKey && !e.altKey && !e.target.closest?.("select, input, textarea")) x.setRiveOnly(!x.riveOnly());
});
// Rive only: the stage page does the hiding. The button and the address follow it, whether it was switched here, by the H key or by the stage's own pill.
$("fin-rive").addEventListener("click", () => { $("frame").contentWindow?.yigExperience?.setRiveOnly(!riveOnly); $("fin-rive").blur(); });
setInterval(() => {
  const x = $("frame").contentWindow?.yigExperience;
  if (!x?.riveOnly || x.riveOnly() === riveOnly) return;
  riveOnly = x.riveOnly();
  $("fin-rive").setAttribute("aria-pressed", String(riveOnly));
  remember();
}, 200);
$("fin-rive").setAttribute("aria-pressed", String(riveOnly));

// the status line and the Jump menu read the experience in the frame
// the fixed game order (GAME_ORDER in the integration file): Wordle, Connections, Spelling Bee, The Mini, The Midi, The Crossword, Strands
const GAMES = [["wordle", "Wordle"], ["connections", "Connections"], ["spelling-bee", "Spelling Bee"], ["mini", "The Mini"], ["midi", "The Midi"], ["daily", "The Crossword"], ["strands", "Strands"]];
// the games each example player has 10 or more completed puzzles in (the stage's PLAYERS table says the same)
const QUALIFYING = { "wordle-only": ["wordle"], "midi-only": ["midi", "daily"], "connections-only": ["connections"], "several-games": ["wordle", "spelling-bee", "mini", "midi", "daily", "strands"], "all-seven": GAMES.map((g) => g[0]), "none": [] };
// every scene in every file, grouped by chapter. goto = file:scene[:community]; flow/player/top say what the scene needs
const SCENES = [
  { group: "Start (File 1)", label: "Loading", goto: "1:loading" },
  { group: "Start (File 1)", label: "Start", goto: "1:start" },
  { group: "Start (File 1)", label: "Ad 1 · the empty Chapter 1 room", goto: "1:ad" },
  ...[1, 2, 3, 4, 5].map((n) => ({ group: "Chapter 1 (File 1)", label: `Card ${n}`, goto: `1:chapter-1-card-${n}` })),
  { group: "Chapter 1 (File 1)", label: "Ad 2 · the empty Chapter 1 room again", goto: "1:ad:2" },
  { group: "Chapter 2 (File 2)", label: "Opener (the shelves)", goto: "2:intro", flow: "sub" },
  ...GAMES.map(([g, name]) => ({ group: "Chapter 2 (File 2)", label: name, goto: `2:${g}`, flow: "sub", game: g })),
  { group: "Chapter 2 (File 2)", label: "Ad 3 · the empty Chapter 3 room (anon)", goto: "2:to-chapter-3", flow: "anon" },
  { group: "Chapter 2.5 (File 2)", label: "Bridge", goto: "2:bridge", flow: "sub", player: "wordle-only" },
  ...[["wordle", "Wordle"], ["connections", "Connections"], ["spelling-bee", "Spelling Bee"], ["mini", "The Mini"], ["strands", "Strands"]]
    .map(([g, name]) => ({ group: "Chapter 2.5 (File 2)", label: `Community card · ${name}`, goto: `2:${g}:community`, flow: "sub", player: "midi-only" })),
  { group: "Chapter 3 (File 3)", label: "Card 1 · the room", goto: "3:chapter-3" },
  { group: "Chapter 3 (File 3)", label: "Card 2 · the ball with the bird on top", goto: "3:chapter-3-bird", flow: "sub" },
  { group: "Chapter 3 (File 3)", label: "Card 3 · event badges (empty room)", goto: "3:ad", flow: "sub", player: "wordle-only" },
  { group: "Chapter 3 (File 3)", label: "Card 4 · achievement badges (empty room)", goto: "3:ad:2", flow: "sub", player: "wordle-only" },
  { group: "Chapter 3 (File 3)", label: "Anon card 3 · Connections hit 1000 (empty room)", goto: "3:ad", flow: "anon" },
  { group: "Chapter 3 (File 3)", label: "Anon card 4 · Wordle turned 5 (empty room)", goto: "3:ad:2", flow: "anon" },
  { group: "Chapter 4 (File 3)", label: "Card 1 · the stack and the ball, no fireworks", goto: "3:chapter-4", flow: "sub" },
  ...GAMES.map(([g, name]) => ({ group: "Chapter 4 (File 3)", label: `Card 2 · top game · ${name}`, goto: "3:chapter-4:2", flow: "sub", top: g })),
  { group: "End (File 3)", label: "End", goto: "3:end" },
];
{
  const groups = new Map();
  let html = '<option value="">a scene…</option>';
  SCENES.forEach((s, i) => { if (!groups.has(s.group)) groups.set(s.group, []); groups.get(s.group).push(`<option value="${i}">${s.label}</option>`); });
  for (const [g, opts] of groups) html += `<optgroup label="${g}">${opts.join("")}</optgroup>`;
  $("jump").innerHTML = html;
}

// the status line reads the experience in the frame
setInterval(() => {
  const x = $("frame").contentWindow?.yigExperience;
  if (!x) return;
  const s = x.state();
  const k = x.cards[s.frame];
  const fw = $("frame").contentWindow;
  $("status").textContent = `Card ${s.frame + 1} of ${x.cards.length} · File ${s.shown} · scene "${s.scenes[s.shown - 1] ?? "…"}"`
    + `${k.community ? " · community card" : ""} · viewport ${fw.innerWidth} × ${fw.innerHeight}`
    + ` · ${fw.innerWidth >= 1025 ? "desktop: arrows" : "tap zones"} · ${x.flow === "anon" ? "anon" : "subscriber"}, top game ${x.top}`;
}, 250);

// always the current build: the server rebuilds a file when its scene.rml changes, and says when each was last built;
// when one is newer than the one the frame loaded, the frame reloads on the card it was on
let builds = null;
setInterval(async () => {
  try {
    const now = JSON.stringify(await (await fetch("/builds", { cache: "no-store" })).json());
    if (builds && now !== builds) {
      const x = $("frame").contentWindow?.yigExperience;
      const at = x ? x.state().frame : 0;
      builds = now;
      $("status").textContent = "A newer build is in: reloading…";
      load(at > 1 ? at : 0);
    }
    builds = builds ?? now;
  } catch { /* the server is restarting: try again next time */ }
}, 2000);

// ---- The Finesse panel. Off by default (the button, or the F key). The clock is in the stage (finesse-clock.js, which the server
// adds to the stage page only when the address has ?finesse=1); this page reads it and draws the timecode, the seams and the controls.
// Turning the panel on or off reloads the stage on the same card, with or without the clock.
function loadTiming() {
  fetch("/room-timing", { cache: "no-store" }).then((r) => r.json()).then((t) => { fin.timing = t; }).catch(() => {});
}
function showFinesse() {
  $("finesse").hidden = !fin.on;
  $("finesse-toggle").setAttribute("aria-pressed", String(fin.on));
}
function setFinesse(on) {
  fin.on = on;
  showFinesse();
  const x = $("frame").contentWindow?.yigExperience;
  const at = x ? x.state().frame : 0;
  load(at > 1 ? at : 0);
}
$("finesse-toggle").addEventListener("click", () => setFinesse(!fin.on));
$("fin-fold").addEventListener("click", () => {
  const folded = $("finesse").classList.toggle("folded");
  $("fin-fold").textContent = folded ? "+" : "–";
});

const clockOf = () => $("frame").contentWindow?.__yigClock;
function setPaused(p) {
  fin.paused = p;
  clockOf()?.setPaused(p);
  $("fin-play").textContent = p ? "▶" : "⏸";
}
$("fin-play").addEventListener("click", () => setPaused(!fin.paused));
$("fin-back").addEventListener("click", () => { setPaused(true); clockOf()?.stepBack(); });
$("fin-fwd").addEventListener("click", () => { setPaused(true); clockOf()?.stepForward(); });
for (const b of document.querySelectorAll("#finesse [data-speed]")) {
  b.addEventListener("click", () => {
    fin.speed = Number(b.dataset.speed);
    clockOf()?.setSpeed(fin.speed);
    for (const o of document.querySelectorAll("#finesse [data-speed]")) o.setAttribute("aria-pressed", String(o === b));
  });
}
// Replay room: reload the experience on this room's first card, the way Jump to does, so the room's intro plays as on a first
// visit and its loop follows
$("fin-replay").addEventListener("click", () => {
  const x = $("frame").contentWindow?.yigExperience;
  if (!x) return;
  const cur = x.cards[x.state().frame];
  const first = x.cards.findIndex((c) => c.file === cur.file && c.scene === cur.scene);
  load(first > 1 ? first : 0);
});
function finesseKeys(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest?.("select, input, textarea")) return;
  if (e.key === "f" || e.key === "F") { e.preventDefault(); setFinesse(!fin.on); return; }
  if (!fin.on) return;
  if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); $("fin-play").click(); }
  if (e.key === ",") $("fin-back").click();
  if (e.key === ".") $("fin-fwd").click();
}
addEventListener("keydown", finesseKeys);
$("frame").addEventListener("load", () => { try { $("frame").contentWindow.addEventListener("keydown", finesseKeys); } catch { /* not ours */ } });

// where the intro ends and each loop restarts, in seconds from the moment the scene is set (a first visit only: a room that
// comes back already built keeps looping from its first visit, so its seams are not tracked)
function seamTimes(t, upto) {
  const out = { loop: [], small: [] };
  if (t.loop) {
    const base = t.intro ?? 0, first = t.intro != null ? 0 : 1;
    for (let k = first; k < 80 && base + k * t.loop <= upto + t.loop * 1.5; k++) out.loop.push(base + k * t.loop);
  }
  if (t.small) for (let k = 0; k < 80 && t.smallStart + k * t.small <= upto + t.small * 1.5; k++) out.small.push(t.smallStart + k * t.small);
  return out;
}
let flashTimer = 0;
function flash(kind) {
  const el = $("seam-flash");
  el.className = `${kind === "small" ? "small " : ""}on`;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.classList.remove("on"), 120);
}
const fmt1 = (v) => v.toFixed(1);
function panelTick() {
  requestAnimationFrame(panelTick);
  if (!fin.on || fin.loading) return;
  const fw = $("frame").contentWindow, x = fw?.yigExperience, clk = fw?.__yigClock;
  if (!x || !clk) return;
  if (clk.speed !== fin.speed) clk.setSpeed(fin.speed);
  if (clk.paused !== fin.paused) clk.setPaused(fin.paused);
  const s = x.state();
  const scene = s.scenes[s.shown - 1] ?? "";
  const key = `${s.shown}:${scene}`;
  if (key !== fin.key) {                                  // a new scene was set: its time starts at 0
    fin.key = key; fin.zero = clk.time; fin.first = !fin.visited.has(key); fin.visited.add(key); fin.lastTc = 0; fin.passed = 0;
  }
  const tc = Math.max(0, (clk.shownTime() - fin.zero) / 1000);
  const t = fin.timing[key] ?? {};
  const room = !!t.loop;
  const seams = fin.first ? seamTimes(t, tc) : { loop: [], small: [] };
  if (tc > fin.lastTc) {                                  // a seam passed since the last look
    if (seams.loop.some((v) => v > fin.lastTc && v <= tc)) { flash("loop"); fin.passed++; }
    else if (seams.small.some((v) => v > fin.lastTc && v <= tc)) { flash("small"); fin.passed++; }
  }
  fin.lastTc = tc;

  $("fin-room").innerHTML = `<b>File ${s.shown} · ${scene}</b>${t.room ? ` · ${t.room}` : ""}<br>`
    + (!room ? "An empty picture: no intro and no loop." : fin.first ? "First visit: the intro plays, then the loop." : "Back again: the room was already built, so its loop keeps its first-visit timing and its seams are not tracked. Use Replay room for a clean run.");
  $("fin-replay").disabled = !room;
  $("fin-time").textContent = fmt1(tc);
  $("fin-frame").textContent = `frame ${Math.round(tc * 60)}`;

  // the strip: the intro, a mark where each loop restarts (orange) and where each small loop restarts (blue), and the playhead
  const intro = t.intro ?? 0;
  const loop = t.loop ?? 10;
  const span = room ? intro + loop * Math.max(2, Math.ceil((tc - intro) / loop) + 1) : 10;
  const sig = `${key}|${span}|${fin.first}`;
  const track = $("fin-track");
  if (track.dataset.sig !== sig) {
    track.dataset.sig = sig;
    const pct = (v) => `${(100 * v) / span}%`;
    const all = seamTimes(t, span);
    track.innerHTML = (intro ? `<div class="intro" style="width:${pct(intro)}"></div>` : "")
      + (fin.first ? all.loop.filter((v) => v < span).map((v) => `<div class="tick" style="left:${pct(v)}"></div>`).join("")
        + all.small.filter((v) => v < span).map((v) => `<div class="tick small" style="left:${pct(v)}"></div>`).join("") : "")
      + '<div class="head" id="fin-head"></div>';
    $("fin-span").textContent = `${fmt1(span)} s`;
  }
  const head = $("fin-head");
  if (head) head.style.left = `${Math.min(100, (100 * tc) / span)}%`;

  const behind = clk.stepsBehind();
  $("fin-hist").textContent = behind > 0 ? `Showing a frame ${behind} behind live (${fmt1(behind / 60)} s). ${clk.available()} frames of history left.` : fin.paused ? "Paused. Step with ◀| and |▶ (or , and .)." : "";
  const list = (a) => a.slice(0, 6).map(fmt1).join(", ") + (a.length > 6 ? ", …" : "");
  const loops = seams.loop;
  $("fin-list").innerHTML = !room ? "" : !fin.first ? "" :
    (intro ? `Intro ends at <b>${fmt1(intro)} s</b>.<br>` : "")
    + `Loop ${intro ? "restarts" : "seams"}: <b>${list(intro ? loops.slice(1) : loops)}</b> s (every ${t.loop.toFixed(2)} s).`
    + (t.small ? `<br>Small loops restart: <b>${list(seams.small)}</b> s (every ${t.small.toFixed(2)} s).` : "")
    + `<br>Seams passed: <b>${fin.passed}</b>`;
}
requestAnimationFrame(panelTick);
if (fin.on) { showFinesse(); loadTiming(); }

// the builds are asked for first, so the frame always loads the current ones
fetch("/builds", { cache: "no-store" }).then((r) => r.json()).then((j) => { builds = JSON.stringify(j); }).catch(() => {}).finally(() => { if (!started) load(); });
</script>
</body>
</html>
